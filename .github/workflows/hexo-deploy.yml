name: Deploy Hexo Site

on:
  push:
    branches: [main]
  workflow_dispatch:

# 允许部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Copy self-hosted fonts
        run: |
          mkdir -p themes/straycat/source/fonts
          cp node_modules/@fontsource/cormorant-garamond/files/*.woff2 themes/straycat/source/fonts/ || true
          cp node_modules/@fontsource/syne/files/*.woff2 themes/straycat/source/fonts/ || true
          cp node_modules/@fontsource/dm-mono/files/*.woff2 themes/straycat/source/fonts/ || true

      - name: Record original image params (before compress)
        run: |
          (which identify >/dev/null 2>&1) || (sudo apt-get update -qq >/dev/null 2>&1 && sudo apt-get install -y -qq imagemagick >/dev/null 2>&1)
          node scripts/image-meta.js

      - name: Optimize images (build-time compression)
        run: |
          (which mogrify >/dev/null 2>&1) || (sudo apt-get update -qq >/dev/null 2>&1 && sudo apt-get install -y -qq imagemagick >/dev/null 2>&1)
          find source/images -type f \( -iname '*.jpg' -o -iname '*.jpeg' \) -size +100k -exec mogrify -resize '1200x1200>' -quality 80 {} + || true
          find source/images -type f \( -iname '*.png' -o -iname '*.webp' \) -size +100k -exec mogrify -resize '1200x1200>' {} + || true
          echo "compression done"

      - name: Generate site
        run: npx hexo generate

      - name: Copy image meta to public
        run: |
          cp source/image_meta.json public/image_meta.json 2>/dev/null && echo "image_meta copied" || echo "no image_meta.json"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
