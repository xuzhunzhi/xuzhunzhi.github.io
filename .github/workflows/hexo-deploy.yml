name: Deploy Hexo Site

on:
  push:
    branches: [main]

# 允许部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，避免互相覆盖
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Copy self-hosted fonts
        run: |
          mkdir -p themes/straycat/source/fonts
          cp node_modules/@fontsource/cormorant-garamond/files/*.woff2 themes/straycat/source/fonts/ || true
          cp node_modules/@fontsource/syne/files/*.woff2 themes/straycat/source/fonts/ || true
          cp node_modules/@fontsource/dm-mono/files/*.woff2 themes/straycat/source/fonts/ || true

      - name: Generate site
        run: npx hexo generate

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
